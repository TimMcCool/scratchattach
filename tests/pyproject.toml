[project]
name = "util"
version = "0.1.0"
description = "Test helpers for the scratchattach testing suite"
readme = "README.md"
authors = [{ name = "TimMcCool" }]
requires-python = ">=3.12.12"
dependencies = [
  "cryptography>=50.0.0",
  "pytest>=9.1.1",
  "python-dotenv>=1.2.3",
  "ruff>=0.16.1",
  "scratchattach",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
config-settings = { editable_mode = "compat" }

[tool.uv.sources]
scratchattach = { path = "../", editable = true }
